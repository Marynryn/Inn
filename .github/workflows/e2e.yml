name: E2E tests

# Виртуальный тестировщик на каждый пуш и PR: поднимает сайт на пустой базе,
# прогоняет сценарии из tests/e2e. Отчёт со скриншотами и трейсами упавших
# тестов лежит в артефактах прогона.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Дёшево и до браузера: типы и форматирование падают за минуту, а не
      # после двадцати минут сценариев.
      - run: npm run typecheck
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      # Сценарии идут на продакшен-сборке (tests/e2e/serve.mjs). Собираем
      # отдельным шагом — так ошибка сборки видна сразу, а не в логе сервера.
      - run: npm run build
      - run: npm test
        env:
          CI: "true"
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            .data/e2e-report
            .data/e2e-results
          retention-days: 14
