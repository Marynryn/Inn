name: Explorer

# Исследователь: агент на Claude ходит по сайту без сценария и ищет, что
# сломано. Платный (токены), поэтому запускается только руками — из вкладки
# Actions. Нужен секрет ANTHROPIC_API_KEY в настройках репозитория.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Потолок ходов агента'
        default: '60'
      focus:
        description: 'На чём сосредоточиться (необязательно)'
        default: ''

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:explore
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXPLORER_STEPS: ${{ inputs.steps }}
          EXPLORER_FOCUS: ${{ inputs.focus }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-report
          path: |
            .data/explorer-report.md
            .data/explorer-report-html
          retention-days: 30
