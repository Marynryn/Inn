name: Notify new chapters

on:
  schedule:
    # Время указано в UTC, МСК = UTC+3. Основной запуск — 12:07 МСК.
    # Минуты нарочно не ровные: в :00 у GitHub самая длинная очередь и запуск опаздывает.
    - cron: '7 9 * * *'
    # Подстраховка на случай, если основной запуск опоздал или его пропустили.
    # Повторов не будет: про уже разосланную главу эндпоинт молчит.
    - cron: '23 11 * * *'
    - cron: '41 14 * * *'
    - cron: '19 17 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call notify endpoint
        run: curl -sf "https://taverna-book.com/api/cron/notify-new-chapters?secret=${{ secrets.NOTIFY_SECRET }}"
